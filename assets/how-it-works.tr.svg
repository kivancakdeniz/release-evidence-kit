<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d" width="1200" height="420">
  <title id="t">Nasıl çalışır: önerilen değişiklikten kayda geçmiş karara dört adım</title>
  <desc id="d">1. adım iki sürüm. 2. adım kör karşılaştırma. 3. adım mühürlenmiş kanıt. 4. adım insan kararı.</desc>
  <style>
    .bg    { fill: #faf9f8; }
    .card  { fill: #ffffff; stroke: #dedede; }
    .ink   { fill: #242424; }
    .muted { fill: #5c5c5c; }
    .acc   { fill: #b11f4b; }
    .accs  { fill: rgba(177,31,75,.08); }
    .st    { stroke: #b11f4b; fill: none; }
    .stm   { stroke: #919191; fill: none; }
    .band  { fill: rgba(177,31,75,.08); stroke: rgba(177,31,75,.25); }
    text   { font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; }
    .num   { font-size: 13px; font-weight: 700; fill: #b11f4b; letter-spacing: .06em; }
    .ttl   { font-size: 20px; font-weight: 700; }
    .cap   { font-size: 15px; }
    .foot  { font-size: 15px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #343231; }
      .card  { fill: #292929; stroke: #474747; }
      .ink   { fill: #dedede; }
      .muted { fill: #919191; }
      .acc   { fill: #fd8ea1; }
      .accs  { fill: rgba(253,142,161,.14); }
      .st    { stroke: #fd8ea1; }
      .stm   { stroke: #5f5f5f; }
      .band  { fill: rgba(253,142,161,.12); stroke: rgba(253,142,161,.3); }
      .num   { fill: #fd8ea1; }
    }
  </style>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#919191"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="420" rx="16"/>

  <!-- ADIM 1 -->
  <g>
    <rect class="card" x="20" y="40" width="260" height="250" rx="16" stroke-width="1.5"/>
    <text class="num" x="44" y="70">1. ADIM</text>
    <g transform="translate(96,88)">
      <rect class="accs" x="0" y="8" width="58" height="74" rx="7"/>
      <rect class="card" x="0" y="8" width="58" height="74" rx="7" stroke-width="1.5" fill="none"/>
      <path class="stm" d="M12 30h34M12 44h34M12 58h22" stroke-width="2.5" stroke-linecap="round"/>
      <rect class="card" x="46" y="0" width="58" height="74" rx="7" stroke-width="1.5"/>
      <path class="st" d="M58 22h34M58 36h34M58 50h22" stroke-width="2.5" stroke-linecap="round"/>
      <circle class="acc" cx="104" cy="0" r="9"/>
    </g>
    <text class="ttl ink" x="44" y="212">İki sürüm</text>
    <text class="cap muted" x="44" y="240">Bugün yayında olan sürüm</text>
    <text class="cap muted" x="44" y="262">ve önerdiğiniz değişiklik.</text>
  </g>
  <line class="stm" x1="288" y1="165" x2="312" y2="165" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ADIM 2 -->
  <g>
    <rect class="card" x="320" y="40" width="260" height="250" rx="16" stroke-width="1.5"/>
    <text class="num" x="344" y="70">2. ADIM</text>
    <g transform="translate(360,86)">
      <rect class="card" x="0" y="0" width="80" height="60" rx="8" stroke-width="1.5"/>
      <text class="ttl acc" x="33" y="40">?</text>
      <rect class="card" x="100" y="0" width="80" height="60" rx="8" stroke-width="1.5"/>
      <text class="ttl acc" x="133" y="40">?</text>
      <g transform="translate(66,72)">
        <path class="stm" d="M2 12c8-9 16-13 22-13s14 4 22 13c-8 9-16 13-22 13s-14-4-22-13z" stroke-width="2.2"/>
        <circle class="stm" cx="24" cy="12" r="4.5" stroke-width="2.2"/>
        <path class="st" d="M2 26 46-2" stroke-width="2.6" stroke-linecap="round"/>
      </g>
    </g>
    <text class="ttl ink" x="344" y="212">Kör karşılaştırma</text>
    <text class="cap muted" x="344" y="240">İnsanlar hangisinin hangisi</text>
    <text class="cap muted" x="344" y="262">olduğunu bilmeden karar verir.</text>
  </g>
  <line class="stm" x1="588" y1="165" x2="612" y2="165" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ADIM 3 -->
  <g>
    <rect class="card" x="620" y="40" width="260" height="250" rx="16" stroke-width="1.5"/>
    <text class="num" x="644" y="70">3. ADIM</text>
    <g transform="translate(690,86)">
      <path class="accs" d="M60 4 112 32v52L60 112 8 84V32z"/>
      <path class="st" d="M60 4 112 32v52L60 112 8 84V32z" stroke-width="2.2" stroke-linejoin="round"/>
      <path class="stm" d="M8 32 60 60l52-28M60 60v52" stroke-width="2" stroke-linejoin="round"/>
      <circle class="card" cx="60" cy="58" r="17" stroke-width="1.5"/>
      <path class="st" d="M53 57v-6a7 7 0 0 1 14 0v6" stroke-width="2.4"/>
      <rect class="acc" x="51" y="57" width="18" height="13" rx="3"/>
    </g>
    <text class="ttl ink" x="644" y="212">Mühürlenmiş kanıt</text>
    <text class="cap muted" x="644" y="240">Sonuçlar dondurulur;</text>
    <text class="cap muted" x="644" y="262">sonradan değişiklik belli olur.</text>
  </g>
  <line class="stm" x1="888" y1="165" x2="912" y2="165" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ADIM 4 -->
  <g>
    <rect class="card" x="920" y="40" width="260" height="250" rx="16" stroke-width="1.5"/>
    <text class="num" x="944" y="70">4. ADIM</text>
    <g transform="translate(985,84)">
      <circle class="stm" cx="30" cy="18" r="13" stroke-width="2.2"/>
      <path class="stm" d="M8 50c0-12 10-20 22-20s22 8 22 20" stroke-width="2.2" stroke-linecap="round"/>
      <rect class="card" x="52" y="26" width="66" height="62" rx="7" stroke-width="1.5"/>
      <path class="stm" d="M64 46h30M64 60h30" stroke-width="2.2" stroke-linecap="round"/>
      <path class="st" d="M64 74l8 8 16-18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="ttl ink" x="944" y="212">İnsan kararı</text>
    <text class="cap muted" x="944" y="240">İsimli bir kişi onaylar</text>
    <text class="cap muted" x="944" y="262">veya reddeder, kayda geçer.</text>
  </g>

  <!-- ALT BANT -->
  <rect class="band" x="20" y="322" width="1160" height="62" rx="12" stroke-width="1.5"/>
  <text class="foot ink" x="48" y="350">Tamamen kendi makinenizde çalışır.</text>
  <text class="cap muted" x="48" y="372">Hesap, sunucu veya bulut gerekmez. Model çağırmaz, hiçbir veri dışarı gitmez.</text>
</svg>
